github:
  owner: wahaha0112
  repo: daily-paper-reader
arxiv_paper_setting:
  mode: standard
  days_window: 9
  docs_dir: docs
  prefer_supabase_read: true
supabase:
  enabled: true
  url: https://lyucdwgefyfbmaiopjbk.supabase.co
  anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
  papers_table: arxiv_papers
  use_vector_rpc: true
  vector_rpc: match_arxiv_papers
  vector_rpc_ann: match_arxiv_papers
  vector_rpc_exact: match_arxiv_papers_exact
  use_bm25_rpc: true
  bm25_rpc: match_arxiv_papers_bm25
  sync_table: arxiv_sync_status
  sync_success_value: success
  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
  - tag: code-vuln
    description: 代码漏洞检测与修复：研究源代码和二进制漏洞检测、定位、自动修复，关注程序语义、跨项目泛化、标签噪声与真实漏洞评测。
    enabled: true
    paused: false
    paper_sources:
    - arxiv
    keywords:
    - keyword: vulnerability detection
      query: software vulnerability detection localization and repair using static analysis dynamic analysis graph
        neural networks and large language models
      enabled: true
      source: manual
    - keyword: vulnerability repair
      query: automated repair of security vulnerabilities with validated patches
      enabled: true
      source: manual
    - keyword: vulnerability generalization
      query: cross project vulnerability detection generalization dataset quality label noise and data leakage
      enabled: true
      source: manual
    intent_queries:
    - query: Find software vulnerability detection and repair studies with realistic cross-project evaluation, robust
        labels, program semantics and interpretable evidence.
      enabled: true
      source: manual
    updated_at: '2026-10-06T01:40:00Z'
  - tag: supply-chain
    description: 软件供应链安全：研究开源依赖和第三方库识别、软件成分分析、SBOM、恶意软件包及供应链漏洞传播；不关注物流供应链。
    enabled: true
    paused: false
    paper_sources:
    - arxiv
    keywords:
    - keyword: software supply chain
      query: software supply chain security malicious dependencies package ecosystems and vulnerability propagation
      enabled: true
      source: manual
    - keyword: software composition analysis
      query: software composition analysis third party library detection and dependency vulnerability identification
      enabled: true
      source: manual
    - keyword: software bill of materials
      query: SBOM software and AI model bill of materials component provenance and security
      enabled: true
      source: manual
    intent_queries:
    - query: Find security research on open-source software dependencies, third-party library identification, SBOM
        accuracy, malicious packages and transitive vulnerability propagation.
      enabled: true
      source: manual
    updated_at: '2026-10-06T01:40:00Z'
  - tag: malware
    description: 恶意软件与移动安全：研究 Android、Windows、恶意 JavaScript 检测分类与解释，关注混淆、对抗攻击、概念漂移、标签噪声和跨时间鲁棒性。
    enabled: true
    paused: false
    paper_sources:
    - arxiv
    keywords:
    - keyword: Android malware
      query: Android malware detection classification interpretation and obfuscation resilience
      enabled: true
      source: manual
    - keyword: malware robustness
      query: robust malware detection under adversarial attacks concept drift and noisy antivirus labels
      enabled: true
      source: manual
    - keyword: malicious JavaScript
      query: malicious JavaScript and Windows malware detection using semantic and behavioral representations
      enabled: true
      source: manual
    intent_queries:
    - query: Find malware detection and classification with realistic obfuscation, adversarial manipulation, temporal
        drift, label noise, and interpretable program behavior.
      enabled: true
      source: manual
    updated_at: '2026-10-06T01:40:00Z'
  - tag: code-analysis
    description: 程序分析与软件测试：研究代码克隆和复用识别、静态动态分析、污点分析、符号执行、模糊测试和测试生成，优先安全与可靠性应用。
    enabled: true
    paused: false
    paper_sources:
    - arxiv
    keywords:
    - keyword: code clone detection
      query: semantic code clone detection and code reuse using program dependence graphs and contrastive learning
      enabled: true
      source: manual
    - keyword: fuzzing
      query: coverage guided and directed fuzzing symbolic execution and taint analysis for software vulnerability
        discovery
      enabled: true
      source: manual
    - keyword: software testing
      query: automated software testing test generation program analysis and validation of LLM generated code
      enabled: true
      source: manual
    intent_queries:
    - query: Find program analysis, semantic clone detection, fuzzing and automated testing methods that improve
        software security or reliability with reproducible evaluations.
      enabled: true
      source: manual
    updated_at: '2026-10-06T01:40:00Z'
  - tag: skill
    description: AI与Agent安全：研究 AI for Security 和 Security for AI，重点是 LLM/Agent 提示注入、工具与 Skill 权限、恶意插件和代码生成安全；不把机器人运动技能学习当成
      Agent Skill 安全。
    enabled: true
    paused: false
    paper_sources:
    - arxiv
    keywords:
    - keyword: prompt injection
      query: prompt injection attacks and defenses in tool using language model agents
      enabled: true
      source: manual
    - keyword: agent security
      query: security of LLM agents skills tools plugins and model context protocol including permission violations
        and data exfiltration
      enabled: true
      source: manual
    - keyword: code generation security
      query: security vulnerabilities and reliability of code generated by large language models
      enabled: true
      source: manual
    intent_queries:
    - query: Find security evaluation and defenses for tool-using LLM agents, malicious skills and plugins, prompt
        injection, authorization failures and insecure generated code. Exclude reinforcement learning motor-skill
        acquisition without a security connection.
      enabled: true
      source: manual
    updated_at: '2026-10-06T01:40:00Z'
  - tag: smart-contract
    description: 智能合约与区块链安全：研究智能合约漏洞、状态化模糊测试、运行时行为图、DeFi 欺诈和庞氏骗局检测；不关注币价预测。
    enabled: true
    paused: false
    paper_sources:
    - arxiv
    keywords:
    - keyword: smart contract vulnerability
      query: smart contract vulnerability detection using static dynamic analysis and stateful fuzzing
      enabled: true
      source: manual
    - keyword: DeFi scam detection
      query: detection of Ethereum scam tokens Ponzi schemes and DeFi fraud with temporal and runtime behavior graphs
      enabled: true
      source: manual
    intent_queries:
    - query: Find empirical and technical security research on smart contract vulnerabilities, stateful fuzzing
        and detection of scam tokens or Ponzi schemes; exclude cryptocurrency price prediction.
      enabled: true
      source: manual
    updated_at: '2026-10-06T01:40:00Z'
